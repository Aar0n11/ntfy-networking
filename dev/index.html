<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>ntfy-networking</title>
    <script>localStorage.setItem("hash", null)</script>
    <script src="./wasm.js"></script>
  </head>
  <body>
    <textarea id="DEBUG_textarea"></textarea>
    <button onclick="debug()">Send message</button>
    <label id="DEBUG_label"></label>
    <br>
    <hr>
    <br>
    <button onclick="testWASM()">Test WASM</button>
    <script src="./ntfy-networking.min.js"></script>
    <script>
      let testWASM;
        createMd5Module().then((Module) => {
            const calculateMd5 = Module.cwrap('calculate_md5', 'string', ['string']);
            testWASM = Module.cwrap('testWASM', 'number', []);

            const doc = document.documentElement.innerHTML;
            const hash = calculateMd5(doc);
            localStorage.setItem("hash", hash);
        });
    </script>
  </body>
</html>
